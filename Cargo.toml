[package]
name = "basalt"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "An embedded SQL database engine built from scratch: parser, planner, MVCC transactions, WAL, B-tree indexes"
license = "MIT"
readme = "README.md"
repository = "https://github.com/joshiii-xyz/basalt"
keywords = ["database", "embedded", "sql", "storage"]
categories = ["database-implementations", "command-line-utilities"]

[lib]
name = "basalt"
path = "src/lib.rs"

[dependencies]

[[bench]]
name = "throughput"
harness = false

[profile.release]
opt-level = 3
lto = true
strip = true
