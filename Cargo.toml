[package]
name = "basalt-db"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "CLI-first local SQL workspaces for structured data and coding agents"
license = "MIT"
readme = "README.md"
repository = "https://github.com/joshiii-xyz/basalt"
keywords = ["agents", "cli", "mcp", "sql", "workspace"]
categories = ["database-implementations", "command-line-utilities"]
exclude = [".github/", "dist-workspace.toml"]

[lib]
name = "basalt"
path = "src/lib.rs"

[[bin]]
name = "basalt"
path = "src/main.rs"

[dependencies]
csv = "1.3"
fs4 = "1.1.0"
rmcp = { version = "3.2.0", features = ["elicitation", "macros", "request-state", "schemars", "server", "transport-io"] }
schemars = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1", features = ["io-std", "net", "rt-multi-thread", "time"] }
uuid = { version = "1", features = ["v4"] }

[[bench]]
name = "throughput"
harness = false

[profile.release]
opt-level = 3
lto = true
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
