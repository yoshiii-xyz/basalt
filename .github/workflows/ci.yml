name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Rust quality components
        run: rustup component add rustfmt clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check all targets
        run: cargo check --all-targets --locked

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo test --all-targets --locked

      - name: Build documentation with warnings denied
        run: cargo doc --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Verify package contents
        run: cargo package --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Run installed-binary smoke test
        run: bash scripts/smoke-test.sh target/release/basalt

      - name: Validate workflow benchmark harness
        run: python3 scripts/benchmark_workspace.py --basalt target/release/basalt --rows 1000 --repeats 1 > benchmark.json

      - name: Run documented SQL differential checks
        run: python3 scripts/differential_sql.py --basalt target/release/basalt
